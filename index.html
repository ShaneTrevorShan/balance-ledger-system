<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger Balance System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style1.css" />

    <link rel="icon" href="Money Cat.png" type="image/png" />
  </head>
  <body>
    <div class="container py-3">
      <div class="ledger-panel p-3 p-md-4 shadow-sm">
        <img
          src="ledger.png"
          alt="Ledger Header"
          class="header-img d-block mx-auto rounded mb-3"
        />
        <p id="greeting" class="text-center"></p>
        <h1 class="text-center">Money Pot</h1>
        <p class="tagline text-center">Managing your finance efficiently</p>

        <div id="result" class="result"></div>

        <div class="d-flex justify-content-end align-items-center gap-2">
          <label for="currency" class="mb-0">Show currency in:</label>
          <select id="currency" class="form-select w-auto">
            <option value="MYR">MYR (RM)</option>
            <option value="USD">USD</option>
          </select>
        </div>

        <div class="table-container table-responsive">
          <table class="table table-hover align-middle mb-0 table-ledger">
            <thead>
              <tr>
                <th>Item</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Share of Salary</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="user.js"></script>
    <script src="table1.js"></script>
    <script src="currency.js"></script>
    <script src="script1.js"></script>
  </body>
</html>
